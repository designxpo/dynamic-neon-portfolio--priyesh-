<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clip">
      <!-- Increase corner radius for a visibly rounded favicon -->
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>
  <!-- Transparent background; only the clipped image is visible so corners appear rounded -->
  <g clip-path="url(#clip)">
    <image href="/images/favicon.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
